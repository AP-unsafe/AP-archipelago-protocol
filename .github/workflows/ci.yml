name: Build LaTeX

on:
  push:
    paths:
      - '**.tex'
      - '**.sty'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
    contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
            ref: main

      - name: Set up TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic titling parskip cleveref listings caption xcolor psnfss graphics latexmk

      - name: Compile
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error protocol.tex

      - name: Generate release timestamp
        id: timestamp
        run: echo "value=$(date -u +'%d/%m-%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
            tag_name: protocol-${{ steps.timestamp.outputs.value }}
            name: Protocol ${{ steps.timestamp.outputs.value }}
            body: Automatically generated PDF from the LaTeX GitHub Actions workflow.
            files: protocol.pdf
            make_latest: true

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: protocol
          path: protocol.pdf
          if-no-files-found: error
          retention-days: 30
